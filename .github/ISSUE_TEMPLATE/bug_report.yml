name: 버그 제보
description: 북두의권 세기말 구세주 전설 한글패치에서 발견한 오류를 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 아래 칸을 채워 주시면 빠르게 확인할 수 있습니다.
        **스크린샷은 "증상" 칸에 이미지를 끌어다 놓거나 Ctrl+V로 붙여넣으면 첨부됩니다.**

  - type: dropdown
    id: version
    attributes:
      label: 패치 버전
      description: 사용 중인 한글패치 버전을 골라 주세요.
      options:
        - v0.95
        - 기타 (증상 칸에 적어 주세요)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 구동 환경
      options:
        - PS1 실기 (CD-R / ODE)
        - MiSTer
        - 에뮬레이터 (PC)
        - 에뮬레이터 (모바일)
        - 기타
    validations:
      required: true

  - type: input
    id: emulator
    attributes:
      label: 에뮬레이터 / 기기 이름
      description: 예) DuckStation, Mednafen, ePSXe, RetroArch(코어 이름), PSIO, XStation
    validations:
      required: false

  - type: input
    id: location
    attributes:
      label: 발생 위치
      description: 예) 3장 시작 대사, 극장 모드, 전투 중
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 증상 (스크린샷 첨부)
      description: 어떤 문제가 있었는지 적고, 스크린샷을 끌어다 놓아 주세요.
      placeholder: 예) 특정 대사에서 글자가 깨져서 나옵니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법 (선택)
      description: 같은 문제를 다시 일으키는 방법을 알고 계시면 적어 주세요.
      placeholder: |
        1. 세이브 불러오기
        2. 다음 장으로 진행
        3. 대사 넘기기
    validations:
      required: false
